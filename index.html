<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>Eye Found It Spinner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        // Bump this and version.json together on each deploy.
        const PAGE_VERSION = "2026-08-03-iosbg";

        const loadAssets = (version) => {
          const css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = "style.css?v=" + encodeURIComponent(version);
          document.head.appendChild(css);

          const script = document.createElement("script");
          script.src = "app.js?v=" + encodeURIComponent(version);
          script.defer = true;
          document.head.appendChild(script);
        };

        const refreshTo = (version) => {
          const url = new URL(location.href);
          url.searchParams.set("v", version);
          location.replace(url.toString());
        };

        const checkForUpdate = async ({ allowRedirect }) => {
          let remote = PAGE_VERSION;
          try {
            const res = await fetch("version.json?ts=" + Date.now(), {
              cache: "no-store",
            });
            if (res.ok) {
              const data = await res.json();
              if (data && data.version) remote = String(data.version);
            }
          } catch (_) {
            /* stay on embedded version */
          }

          const params = new URLSearchParams(location.search);
          if (
            allowRedirect &&
            remote !== PAGE_VERSION &&
            params.get("v") !== remote
          ) {
            refreshTo(remote);
            return null;
          }

          return remote;
        };

        checkForUpdate({ allowRedirect: true }).then((version) => {
          if (version) loadAssets(version);
        });

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState !== "visible") return;
          checkForUpdate({ allowRedirect: true });
        });
      })();
    </script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="app">
      <header class="brand">
        <p class="brand-mark">Eye Found It</p>
      </header>

      <section
        class="spinner-stage"
        id="spinnerStage"
        aria-label="Game spinner. Flick to spin, or use the spin button."
      >
        <div class="wheel-shell">
          <div
            class="wheel"
            id="wheel"
            role="img"
            aria-label="Spinner wheel with twelve segments"
          >
            <div class="wheel-face"></div>
            <div class="labels" id="labels"></div>
          </div>
        </div>

        <div class="needle" id="needle" aria-hidden="true">
          <div class="needle-arm">
            <svg class="needle-svg" viewBox="0 0 48 300">
              <path
                d="M24 4 L38 72 L31 72 L31 168 L31 198 C31 210 24 214 24 214 C24 214 17 210 17 198 L17 168 L17 72 L10 72 Z"
                fill="#1a1a1a"
              />
              <circle cx="24" cy="150" r="12" fill="#f7f3e8" />
              <circle cx="24" cy="150" r="5.5" fill="#1a1a1a" />
            </svg>
          </div>
        </div>

        <div class="hub" aria-hidden="true"></div>
      </section>

      <section class="controls">
        <p class="result" id="result" aria-live="polite">Flick the needle or tap spin</p>
        <button type="button" class="spin-btn" id="spinBtn">Spin</button>
      </section>
    </main>
  </body>
</html>
