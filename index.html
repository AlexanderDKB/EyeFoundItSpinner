<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#87d6ef" />
    <title>Eye Found It Spinner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="app">
      <header class="brand">
        <p class="brand-mark">Eye Found It</p>
      </header>

      <section
        class="spinner-stage"
        id="spinnerStage"
        aria-label="Game spinner. Flick to spin, or use the spin button."
      >
        <div class="wheel-shell">
          <div
            class="wheel"
            id="wheel"
            role="img"
            aria-label="Spinner wheel with twelve segments"
          >
            <div class="wheel-face"></div>
            <div class="labels" id="labels"></div>
          </div>
        </div>

        <div class="needle" id="needle" aria-hidden="true">
          <div class="needle-arm">
            <svg class="needle-svg" viewBox="0 0 48 340">
              <path
                d="M24 4 L38 78 L31 78 L31 210 L40 210 L24 268 L8 210 L17 210 L17 78 L10 78 Z"
                fill="#1a1a1a"
              />
              <circle cx="24" cy="170" r="12" fill="#f7f3e8" />
              <circle cx="24" cy="170" r="5.5" fill="#1a1a1a" />
            </svg>
          </div>
        </div>

        <div class="hub" aria-hidden="true"></div>
      </section>

      <section class="controls">
        <p class="result" id="result" aria-live="polite">Flick the needle or tap spin</p>
        <button type="button" class="spin-btn" id="spinBtn">Spin</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
